name: Release

# Tag pushen → Binaries bauen → GitHub-Release mit Changelog-Abschnitt
#   git tag v0.11.0 && git push origin v0.11.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04        # ältere glibc → läuft auch auf älteren Distros
            asset: kit-linux-x64
          - os: ubuntu-22.04-arm
            asset: kit-linux-arm64
          - os: windows-latest
            asset: kit-windows-x64.exe
          - os: macos-latest
            asset: kit-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tag passt zur Version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu Cargo.toml ($version)"
            exit 1
          fi

      - name: Tests
        run: cargo test --locked

      - name: Binary bauen
        shell: bash
        run: |
          cargo build --release --locked
          src=target/release/kit; [ "$RUNNER_OS" = "Windows" ] && src=target/release/kit.exe
          mkdir -p out && cp "$src" "out/${{ matrix.asset }}"

      - name: Binary startet
        shell: bash
        run: ./out/${{ matrix.asset }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Prüfsummen
        working-directory: out
        run: sha256sum kit-* > SHA256SUMS && cat SHA256SUMS

      - name: Release-Notes aus CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          ---
          **Installieren / Aktualisieren**

          Linux / macOS:
          ```bash
          curl -fsSL https://raw.githubusercontent.com/jli-software/kit/master/install.sh | sh
          ```

          Windows (PowerShell):
          ```powershell
          irm https://raw.githubusercontent.com/jli-software/kit/master/install.ps1 | iex
          ```
          EOF
          cat notes.md

      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --title "kit $GITHUB_REF_NAME" --notes-file notes.md --latest
